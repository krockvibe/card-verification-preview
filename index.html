<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Card Verification Preview</title>
<style>
  * { box-sizing: border-box; }

  html {
    /* Tracks the device/browser font-size setting, with a mild bump on
       wide screens. Everything below is sized in rem, so the whole page
       scales with whatever the viewer has set. */
    font-size: clamp(100%, 0.85rem + 0.3vw, 112%);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.125rem max(1.25rem, env(safe-area-inset-left)) 1.75rem max(1.25rem, env(safe-area-inset-right));
    background: #fff;
  }

  .card-wrap {
    width: min(46vw, 27.5rem);
    margin: 0 auto 2.625rem;
    display: flex;
    justify-content: center;
  }

  .credit-card {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    border-radius: 1.5rem;
  }

  h1 {
    margin: 0;
    padding: 0 1.25rem;
    text-align: center;
    font-size: clamp(2.125rem, 3.4vw, 3rem);
    line-height: 1.08;
    letter-spacing: -0.035em;
    font-weight: 700;
  }

  .subtitle {
    margin: 1.6875rem 1.25rem 2.875rem;
    text-align: center;
    font-size: clamp(1.0625rem, 1.9vw, 1.4375rem);
    line-height: 1.35;
    color: #222;
  }

  .options {
    width: min(92vw, 41.875rem);
    overflow: hidden;
    border-radius: 1.0625rem;
    background: #f1f0f7;
  }

  .option {
    width: 100%;
    min-height: 6.75rem;
    padding: 1.3125rem 3.875rem 1.1875rem 1.875rem;
    position: relative;
    border: 0;
    border-radius: 0;
    background: transparent;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }

  .option + .option {
    border-top: 1px solid rgba(0,0,0,.055);
  }

  .title {
    display: block;
    margin-bottom: 0.1875rem;
    font-size: clamp(1.1875rem, 2.1vw, 1.625rem);
    line-height: 1.2;
    font-weight: 500;
  }

  .detail {
    display: block;
    font-size: clamp(1.0625rem, 1.9vw, 1.375rem);
    line-height: 1.25;
    color: #5a5a63;
  }

  .check {
    position: absolute;
    right: 29px;
    top: 50%;
    width: 23px;
    height: 13px;
    border-left: 3px solid #087ff5;
    border-bottom: 3px solid #087ff5;
    transform: translateY(-70%) rotate(-45deg);
    display: none;
  }

  .option[aria-checked="true"] .check {
    display: block;
  }

  .option:focus-visible {
    outline: 3px solid #087ff5;
    outline-offset: -3px;
  }

  .bottom {
    width: min(88vw, 40rem);
    margin-top: auto;
    padding-top: 5rem;
  }

  .next {
    width: 100%;
    height: 5.5rem;
    border: 0;
    border-radius: 1.6875rem;
    background: #087ff5;
    color: white;
    font-family: inherit;
    font-size: clamp(1.625rem, 2.5vw, 2.125rem);
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    position: relative;
    overflow: visible;
  }

  .touch {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10.3125rem;
    height: 10.3125rem;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,.22);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 1px 7px rgba(0,0,0,.12);
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .card-wrap { width: 58vw; max-width: 20.625rem; }
    .page { padding: 0.75rem max(1.25rem, env(safe-area-inset-left)) 1.5rem max(1.25rem, env(safe-area-inset-right)); }
    .card-wrap { margin-bottom: 2.125rem; }
    .subtitle { margin: 1.375rem 1.25rem 2.375rem; }
    .option { padding-left: 1.5rem; padding-right: 3.375rem; }
    .bottom { padding-top: 3.4375rem; }
    .next { height: 5.125rem; }
    .touch { width: 8.4375rem; height: 8.4375rem; }
  }

  @media (max-width: 400px) {
    .card-wrap { width: 68vw; max-width: 16.875rem; }
    .options { width: calc(100vw - 2rem); }
    .bottom { width: calc(100vw - 2.75rem); }
    .option { min-height: 6rem; padding-left: 1.25rem; padding-right: 3rem; }
    .next { height: 4.625rem; }
    .touch { width: 7.1875rem; height: 7.1875rem; }
  }
</style>
</head>

<body>
<main class="page">

  <div class="card-wrap">
    <img
      class="credit-card"
      src="card.png"
      alt=""
    >
  </div>

  <h1>Card Verification</h1>

  <p class="subtitle">
    Choose how to verify your card for mobile payment.
  </p>

  <section class="options" role="radiogroup" aria-label="Verification methods">

    <button class="option" type="button" role="radio" aria-checked="true">
      <span class="title">Text Message</span>
      <span class="detail">***-***-6187</span>
      <span class="check" aria-hidden="true"></span>
    </button>

    <button class="option" type="button" role="radio" aria-checked="false">
      <span class="title">Email Address</span>
      <span class="detail">u*********de@gmail.com</span>
      <span class="check" aria-hidden="true"></span>
    </button>

  </section>

  <div class="bottom">
    <button class="next" type="button">
      Next
    </button>
  </div>

</main>
<script>
  const options = Array.from(document.querySelectorAll('.option'));

  function select(opt) {
    options.forEach((o) => {
      o.setAttribute('aria-checked', o === opt ? 'true' : 'false');
      o.tabIndex = o === opt ? 0 : -1;
    });
    opt.focus();
  }

  options.forEach((opt, i) => {
    opt.tabIndex = opt.getAttribute('aria-checked') === 'true' ? 0 : -1;

    opt.addEventListener('click', () => select(opt));

    opt.addEventListener('keydown', (e) => {
      let next = null;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        next = (i + 1) % options.length;
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        next = (i - 1 + options.length) % options.length;
      }
      if (next !== null) {
        e.preventDefault();
        select(options[next]);
      }
    });
  });
</script>
</body>
</html>
